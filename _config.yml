title: AWS Certifications
description: Notas y recursos para las certificaciones de AWS
url: https://estebankroh.com
baseurl: /aws-certifications
lang: es

remote_theme: just-the-docs/just-the-docs@v0.12.0
search_enabled: true
color_scheme: dark
permalink: pretty

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-sitemap
  - jekyll-redirect-from

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: false
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Dockerfile
  - docker-compose.yml
  - cspell.json
  - README.md
  - node_modules
  - vendor
